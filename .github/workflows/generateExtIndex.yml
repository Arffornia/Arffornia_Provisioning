name: Generate External Files Index

on:
  push:
    branches:
      - main

jobs:
  generate-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate index.json
        run: npx ts-node generateIndexes.ts

      # Resolves only mods added since the last lock (the PR test already demands a full lock);
      # a failure keeps the job red but the partial lock is still committed.
      - name: Generate modList.lock.json
        id: lock
        continue-on-error: true
        run: npx ts-node generateModLocks.ts
        env:
          # Optional. Without it the bot can only reuse locked entries (the proxy refuses runners).
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/proxy/index.json config/server/index.json config/launcher/index.json config/launcher/modList.lock.json config/server/modList.lock.json
          git commit -m "🔃 Update indexes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail when some mods could not be locked
        if: steps.lock.outcome == 'failure'
        run: |
          echo "::error::Some mods could not be locked, see the 'Generate modList.lock.json' step"
          exit 1