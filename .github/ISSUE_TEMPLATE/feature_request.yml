name: Feature or content request
description: Add or change a mod, a config, or the tooling
labels: ["type: feature"]
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What should change, and for which kind (server / proxy / launcher)?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
